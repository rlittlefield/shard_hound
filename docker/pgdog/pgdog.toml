role = "primary"

# Future shards, declared in their final shape and kept out of the
# serving topology until `ADD SHARD shard_hound_dev <n>` activates
# them, one at a time and in order. After each activation, drop the
# shard's `provisioning` flag from this manifest (the durable record;
# startup convergence from the `pgdog.config` marker is the fallback).

