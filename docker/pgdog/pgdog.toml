[general]
host = "0.0.0.0"
port = 6432
workers = 2
default_pool_size = 10
pooler_mode = "transaction"
prepared_statements = "extended"
query_parser = "on"
auth_type = "trust"
openmetrics_port = 9090
openmetrics_namespace = "pgdog_"
sharding_lookup_timeout = 5_000
sharding_lookup_cache_size = 67_108_864
# Text COPY: the binary format assumes 8-byte ints and breaks on the
# integer columns (organizations.shard_id, shards.shard_id) during
# ADD SHARD's omni data sync.
resharding_copy_format = "text"

[admin]
user = "admin"
password = "pgdog"

[[databases]]
name = "shard_hound_dev"
host = "shard_0"
port = 5432
database_name = "shard_hound_dev"
shard = 0
role = "primary"

[[databases]]
name = "shard_hound_dev"
host = "shard_1"
port = 5432
database_name = "shard_hound_dev"
shard = 1
role = "primary"

# Shards 2 and 3 started as `provisioning = true` entries and were
# activated by ADD SHARD; per the workflow, the flag comes off the
# manifest after activation. Startup convergence can also re-activate
# a flagged-but-activated shard from its `pgdog.config` marker, but
# don't lean on it: removing the flag is the durable record.
[[databases]]
name = "shard_hound_dev"
host = "shard_2"
port = 5432
database_name = "shard_hound_dev"
shard = 2
role = "primary"

[[databases]]
name = "shard_hound_dev"
host = "shard_3"
port = 5432
database_name = "shard_hound_dev"
shard = 3
role = "primary"

# The next future shard, declared in its final shape and kept out of
# the serving topology until `ADD SHARD shard_hound_dev 4` activates
# it.

[[databases]]
name = "shard_hound_dev"
host = "shard_4"
port = 5432
database_name = "shard_hound_dev"
shard = 4
role = "primary"
provisioning = true

[[omnisharded_tables]]
database = "shard_hound_dev"
tables = ["organizations", "shard_hound_packages", "shards"]
sticky = false

[[sharded_tables]]
database = "shard_hound_dev"
column = "organization_id"
data_type = "bigint"
lookup_query = "SELECT shard_id FROM organizations WHERE id = $1"
lookup_result = "shard"
# MOVE KEYS flips a tenant's placement by running this on every shard
# at the cutover: $1 is the organization id, $2 the new shard number.
move_query = "UPDATE organizations SET shard_id = $2 WHERE id = $1"
