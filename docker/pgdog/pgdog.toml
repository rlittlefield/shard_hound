[[omnisharded_tables]]
database = "shard_hound_dev"
tables = ["organizations", "shard_hound_packages", "shards"]
sticky = false

[[sharded_tables]]
database = "shard_hound_dev"
column = "organization_id"
data_type = "bigint"
lookup_query = "SELECT shard_id FROM organizations WHERE id = $1"
lookup_result = "shard"
# MOVE KEYS flips a tenant's placement by running this on every shard
# at the cutover: $1 is the organization id, $2 the new shard number.
move_query = "UPDATE organizations SET shard_id = $2 WHERE id = $1"

# Hybrid table: keyed rows live on their tenant's shard like any
# sharded table, but rows with a NULL organization_id are shared
# defaults that broadcast to every shard — and ADD SHARD copies
# exactly those rows to the new shard, while MOVE KEYS moves only the
# tenant's keyed rows and leaves the defaults in place. The kind needs
# a table name (pgdog enumerates the table into its publications), and
# the named rule must come after the column-only rule so it wins the
# enumeration. MOVE KEYS requires every rule to place by lookup and
# carry the move_query, so both repeat here (the cutover deduplicates
# identical move queries). The table itself must use REPLICA IDENTITY
# FULL: no identity index can include its nullable sharding column.
[[sharded_tables]]
database = "shard_hound_dev"
name = "custom_packages"
column = "organization_id"
data_type = "bigint"
lookup_query = "SELECT shard_id FROM organizations WHERE id = $1"
lookup_result = "shard"
move_query = "UPDATE organizations SET shard_id = $2 WHERE id = $1"
kind = "hybrid"
