[general]
host = "0.0.0.0"
port = 6432
workers = 2
default_pool_size = 10
pooler_mode = "transaction"
prepared_statements = "extended"
query_parser = "on"
auth_type = "trust"
openmetrics_port = 9090
openmetrics_namespace = "pgdog_"
sharding_lookup_timeout = 5_000
sharding_lookup_cache_size = 67_108_864
# Text COPY: the binary format assumes 8-byte ints and breaks on the
# integer columns (organizations.shard_id, shards.shard_id) during
# ADD SHARD's omni data sync.
resharding_copy_format = "text"

[admin]
user = "admin"
password = "pgdog"

[[databases]]
name = "shard_hound_dev"
host = "shard_0"
port = 5432
database_name = "shard_hound_dev"
shard = 0
role = "primary"

[[databases]]
name = "shard_hound_dev"
host = "shard_1"
port = 5432
database_name = "shard_hound_dev"
shard = 1
role = "primary"

# Shards 2 through 5 started as `provisioning = true` entries and were
# activated by ADD SHARD; per the workflow, the flag comes off the
# manifest after activation. Startup convergence can also re-activate
# a flagged-but-activated shard from its `pgdog.config` marker, but
# don't lean on it: removing the flag is the durable record.
[[databases]]
name = "shard_hound_dev"
host = "shard_2"
port = 5432
database_name = "shard_hound_dev"
shard = 2
role = "primary"

