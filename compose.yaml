    volumes: [postgres_shard_18_data:/var/lib/postgresql]

  shard_19:
    <<: *shard
    ports: ["127.0.0.1:5453:5432"]
    volumes: [postgres_shard_19_data:/var/lib/postgresql]

  pgdog:
    image: pgdog:move-keys-broadcast-null-v3
    depends_on:
      shard_0:
        condition: service_healthy
      shard_1:
        condition: service_healthy
      shard_2:
        condition: service_healthy
      shard_3:
        condition: service_healthy
      shard_4:
        condition: service_healthy
      shard_5:
        condition: service_healthy
      shard_6:
        condition: service_healthy
      shard_7:
        condition: service_healthy
      shard_8:
        condition: service_healthy
      shard_9:
        condition: service_healthy
      shard_10:
        condition: service_healthy
      shard_11:
        condition: service_healthy
      shard_12:
        condition: service_healthy
      shard_13:
        condition: service_healthy
      shard_14:
        condition: service_healthy
      shard_15:
        condition: service_healthy
      shard_16:
        condition: service_healthy
      shard_17:
        condition: service_healthy
      shard_18:
        condition: service_healthy
      shard_19:
        condition: service_healthy
    environment:
      RUST_LOG: info
    # Host ports 6433/9091: the k3s cluster in the colima VM already
    # forwards 6432 and 9090 to its own pgdog stack.
    ports:
      - "127.0.0.1:6433:6432"
      - "127.0.0.1:9091:9090"
    volumes:
      - ./docker/pgdog/pgdog.toml:/pgdog/pgdog.toml:ro
      - ./docker/pgdog/users.toml:/pgdog/users.toml:ro

