# ADD SHARD and MOVE KEYS sync data over logical replication, so every
# shard runs with wal_level=logical and headroom for slots (shard 0
# sources the omni snapshot for every ADD SHARD, and each MOVE KEYS
# holds a slot on its source shard).
x-shard: &shard
  image: postgres:18
  command: -c wal_level=logical -c max_replication_slots=32 -c max_wal_senders=32
  environment:
    POSTGRES_DB: shard_hound_dev
    POSTGRES_PASSWORD: postgres
    POSTGRES_USER: postgres
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d shard_hound_dev"]
    interval: 5s
    timeout: 5s
    retries: 10

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: shard_hound_dev
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    # Host port 5436: localhost:5432 is already taken by the k3s
    # svclb-postgres forward inside the colima VM.
    ports:
      - "127.0.0.1:5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shard_hound_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

  # Host ports: 5432 belongs to k3s, 5436 to the control database, so
  # the shards take 5433-5435 and 5437 onward. Shards 0-5 are serving;
  # everything after them is a pre-declared future shard, kept out of
  # the serving topology by `provisioning = true` entries in
  # pgdog.toml. Each `ADD SHARD shard_hound_dev <n>` (or the UI's Add
  # shard button) activates the next one, in order. They idle empty
  # until then.
  shard_0:
    <<: *shard
    ports: ["127.0.0.1:5433:5432"]
    volumes: [postgres_shard_0_data:/var/lib/postgresql]

  shard_1:
    <<: *shard
    ports: ["127.0.0.1:5434:5432"]
    volumes: [postgres_shard_1_data:/var/lib/postgresql]

  shard_2:
    <<: *shard
    ports: ["127.0.0.1:5435:5432"]
    volumes: [postgres_shard_2_data:/var/lib/postgresql]

  shard_3:
    <<: *shard
    ports: ["127.0.0.1:5437:5432"]
    volumes: [postgres_shard_3_data:/var/lib/postgresql]

  shard_4:
    <<: *shard
    ports: ["127.0.0.1:5438:5432"]
    volumes: [postgres_shard_4_data:/var/lib/postgresql]

  shard_5:
    <<: *shard
    ports: ["127.0.0.1:5439:5432"]
    volumes: [postgres_shard_5_data:/var/lib/postgresql]

  shard_6:
    <<: *shard
    ports: ["127.0.0.1:5440:5432"]
    volumes: [postgres_shard_6_data:/var/lib/postgresql]

  shard_7:
