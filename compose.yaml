    volumes: [postgres_shard_11_data:/var/lib/postgresql]

  shard_12:
    <<: *shard
    ports: ["127.0.0.1:5446:5432"]
    volumes: [postgres_shard_12_data:/var/lib/postgresql]

  shard_13:
    <<: *shard
    ports: ["127.0.0.1:5447:5432"]
    volumes: [postgres_shard_13_data:/var/lib/postgresql]

  shard_14:
